version: '3.8'

services:
  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: recip52_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recip_user
      POSTGRES_PASSWORD: recip_password
      POSTGRES_DB: recip52_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recip_user -d recip52_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: recip52_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express API Service (Optional container mode)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: recip52_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgres://recip_user:recip_password@postgres:5432/recip52_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_change_in_production_recip52_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
