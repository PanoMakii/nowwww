<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
          SEO & META TAGS
    ============================================================ -->
    <title>Recip52 – Your Personalized Nutrition Companion</title>
    <meta name="description" content="Track meals, discover healthy recipes, and achieve your wellness goals with Recip52. Trusted by 150,000+ healthy eaters." />
    <meta name="keywords" content="meal planning, healthy eating, nutrition tracker, recipes, wellness, AI meal planner" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://recip52.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Recip52 – Your Personalized Nutrition Companion" />
    <meta property="og:description" content="Track meals, discover healthy recipes, and achieve your wellness goals effortlessly." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://recip52.com" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recip52 – Your Personalized Nutrition Companion" />
    <meta name="twitter:description" content="Track meals, discover healthy recipes, and achieve your wellness goals." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- ============================================================
          FONT PRELOAD
    ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
