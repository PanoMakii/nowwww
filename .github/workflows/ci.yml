name: Recip52 CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true # soft warning while migrating

      - name: Build Frontend
        run: npm run build

  backend-ci:
    name: Backend Lint & Schema Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recip_user
          POSTGRES_PASSWORD: recip_password
          POSTGRES_DB: recip52_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Validate Database Schema Migration
        working-directory: ./server
        env:
          DATABASE_URL: postgres://recip_user:recip_password@localhost:5432/recip52_db
          NODE_ENV: test
        run: npm run db:migrate

      - name: Run Automated Test Suites
        working-directory: ./server
        env:
          NODE_ENV: test
        run: npm test

      - name: Smoke Test Server Boot
        working-directory: ./server
        env:
          PORT: 5001
          DATABASE_URL: postgres://recip_user:recip_password@localhost:5432/recip52_db
          NODE_ENV: test
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          kill $SERVER_PID

  docker-ci:
    name: Docker Multi-Stage Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t recip52-backend:ci ./server

      - name: Build Frontend Docker Image
        run: docker build -t recip52-frontend:ci .

